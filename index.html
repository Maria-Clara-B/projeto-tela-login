<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>

    <link rel="stylesheet" href="estilos/estilo.css">

    <link rel="stylesheet" href="estilos/telas-grandes.css">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>
<body>
    <main>
        <section>
            <div id="imagem">
                <!-- a imagem VAI AQUI-->
            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Reiciendis libero accusantium minima excepturi eius aliquid nihil assumenda, natus sint. Consequatur officiis et quibusdam deleniti sequi cumque doloribus commodi, deserunt similique.</p>

                <form action="login.php" method="post">
                    <div class="campo" id="campo1">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="ilogin" placeholder="seu email" autocomplete="email" required maxlength="30"> <!-- começamos com o input, o tipo e email, nome: login, id: ilogin placeholder e a mensagerm que aparece no fundo da caixa. O altocomplet serve para autocomplete, ele é do tipo email. Required torna obrigatorio. Maxlength define o maximo de caracteres-->
                        <label for="ilogin">Login</label>
                    </div>

                    <div class="campo" id="campo2">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="senha" id="senha" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="30">
                        <label for="isenha">Senha</label>
                    </div>

                    <input type="submit" value="Entrar">
                    <a href="esqueci.html" class="botao">Esqueci a senha</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
